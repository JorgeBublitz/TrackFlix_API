tags:
  - name: Auth
    description: Registro, login e controle de sessão
  - name: Users
    description: Consulta e manutenção de usuários

paths:
  /api/auth/v2/register:
    post:
      tags: [Auth]
      summary: Registrar novo usuário
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        201:
          description: Usuário criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
        400:
          description: Dados inválidos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        409:
          description: Email já está em uso

  /api/auth/v2/login:
    post:
      tags: [Auth]
      summary: Login (retorna access token e refresh token)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        200:
          description: Login realizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        401:
          description: Email ou senha inválidos

  /api/auth/v2/refresh:
    post:
      tags: [Auth]
      summary: Renovar tokens
      description: >
        Troca um refresh token válido por um novo par de tokens. O refresh token
        antigo é invalidado (rotação). Também aceita o token no header `x-refresh-token`.
      security: []
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        200:
          description: Tokens renovados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        400:
          description: Refresh token não enviado
        401:
          description: Refresh token inválido ou expirado

  /api/auth/v2/logout:
    post:
      tags: [Auth]
      summary: Logout (invalida o refresh token)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        200:
          description: Logout realizado
        401:
          description: Não autenticado

  /api/auth/v2/me:
    get:
      tags: [Auth]
      summary: Dados do usuário autenticado
      responses:
        200:
          description: Usuário autenticado (id e email)
        401:
          description: Não autenticado

  /api/auth/v2/users:
    get:
      tags: [Users]
      summary: Listar usuários
      security: []
      responses:
        200:
          description: Lista de usuários (sem senha)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/User" }

  /api/auth/v2/getByName:
    get:
      tags: [Users]
      summary: Buscar usuários pelo nome
      security: []
      parameters:
        - in: query
          name: name
          required: true
          schema: { type: string }
      responses:
        200:
          description: Usuários encontrados
        400:
          description: Nome não informado

  /api/auth/v2/users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Users]
      summary: Atualizar o próprio usuário
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        200:
          description: Usuário atualizado
        400:
          description: Dados inválidos
        403:
          description: Tentativa de alterar outro usuário
        409:
          description: Email já está em uso
    delete:
      tags: [Users]
      summary: Remover o próprio usuário
      responses:
        200:
          description: Usuário removido (favoritos, listas e comentários são removidos em cascata)
        403:
          description: Tentativa de remover outro usuário
        404:
          description: Usuário não encontrado
